<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Packing List Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');

  :root {
    --bg: #f5f5f0;
    --surface: #ffffff;
    --border: #d6d6cc;
    --border-focus: #5c7a5c;
    --text: #1a1a1a;
    --text-muted: #6b6b60;
    --accent: #4a6741;
    --accent-light: #dddccc;
    --accent-hover: #3a5332;
    --tag-bg: #eeeee8;
    --disabled-bg: #f0f0eb;
    --disabled-text: #aaa;
    --error: #c0392b;
    --success: #2e7d32;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
    --radius: 6px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 16px 64px;
  }

  .page {
    max-width: 860px;
    margin: 0 auto;
  }

  /* Header */
  .app-header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 36px;
    border-bottom: 1.5px solid var(--accent);
    padding-bottom: 16px;
  }
  .app-title {
    font-family: var(--mono);
    font-size: 1.5rem;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--accent);
  }
  .app-subtitle {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-family: var(--mono);
  }

  /* Sections */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 20px;
    overflow: hidden;
  }
  .section-header {
    background: var(--accent-light);
    padding: 10px 20px;
    font-family: var(--mono);
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
  }
  .section-body {
    padding: 20px;
  }

  /* Form grid */
  .form-grid {
    display: grid;
    gap: 16px;
  }
  .form-grid-2 { grid-template-columns: 1fr 1fr; }
  .form-grid-3 { grid-template-columns: 2fr 1fr 1fr; }
  .form-grid-4 { grid-template-columns: 2fr 1fr 1fr 1fr; }

  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  label {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 500;
  }
  input[type="text"], input[type="date"] {
    font-family: var(--sans);
    font-size: 0.9rem;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
    transition: border-color 0.15s;
    width: 100%;
  }
  input[type="text"]:focus, input[type="date"]:focus {
    outline: none;
    border-color: var(--border-focus);
    background: #fff;
  }
  input:disabled {
    background: var(--disabled-bg);
    color: var(--disabled-text);
    cursor: not-allowed;
  }

  /* Product rows */
  .product-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .product-col-headers {
    display: grid;
    grid-template-columns: 1fr 80px 1fr;
    gap: 10px;
    padding: 0 10px 8px;
    font-family: var(--mono);
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .product-col-headers span:nth-child(2) { text-align: center; }

  .product-row {
    display: grid;
    grid-template-columns: 1fr 80px 1fr;
    gap: 10px;
    align-items: center;
    padding: 8px 10px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    transition: background 0.1s, border-color 0.1s;
  }
  .product-row:hover { background: var(--tag-bg); }
  .product-row.active {
    background: #f0f4ef;
    border-color: #c3d4c2;
  }

  .product-check {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
  }
  .product-check input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  .product-check-label {
    font-size: 0.875rem;
    line-height: 1.3;
  }
  .product-code {
    display: block;
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--text-muted);
    margin-top: 1px;
  }

  .qty-input {
    width: 80px;
    text-align: center;
    font-family: var(--mono);
  }

  .serial-input {
    font-size: 0.82rem;
    font-family: var(--mono);
  }

  /* Options row */
  .options-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 0.875rem;
    user-select: none;
  }
  .checkbox-label input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }

  /* Buttons */
  .btn {
    font-family: var(--sans);
    font-size: 0.875rem;
    font-weight: 600;
    padding: 10px 22px;
    border-radius: var(--radius);
    border: none;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled {
    background: #aaa;
    cursor: not-allowed;
    transform: none;
  }
  .btn-outline {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-outline:hover { background: var(--tag-bg); }

  .actions-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .file-name-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 200px;
  }
  .file-name-group label {
    white-space: nowrap;
  }
  .file-ext {
    font-family: var(--mono);
    font-size: 0.85rem;
    color: var(--text-muted);
    white-space: nowrap;
  }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 28px;
    right: 28px;
    background: var(--success);
    color: #fff;
    padding: 12px 20px;
    border-radius: var(--radius);
    font-size: 0.875rem;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 999;
    max-width: 320px;
  }
  #toast.error { background: var(--error); }
  #toast.show { opacity: 1; pointer-events: auto; }

  /* Divider */
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 16px 0;
  }

  @media (max-width: 600px) {
    .form-grid-2, .form-grid-3, .form-grid-4 {
      grid-template-columns: 1fr;
    }
    .product-col-headers { display: none; }
    .product-row {
      grid-template-columns: 1fr;
    }
    .qty-input { width: 100%; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="app-header">
    <h1 class="app-title">Packing List Generator</h1>
    <span class="app-subtitle">Nuvve Corp</span>
  </header>

  <!-- Shipping Information -->
  <div class="section">
    <div class="section-header">Shipping Information</div>
    <div class="section-body">
      <div class="form-grid form-grid-2" style="margin-bottom:16px;">
        <div class="field">
          <label for="coname">Company Name</label>
          <input type="text" id="coname" placeholder="Recipient company" />
        </div>
        <div class="field">
          <label for="shipdate">Shipping Date</label>
          <input type="date" id="shipdate" />
        </div>
      </div>
      <div class="form-grid form-grid-2" style="margin-bottom:16px;">
        <div class="field">
          <label for="street">Street Address</label>
          <input type="text" id="street" placeholder="123 Main St" />
        </div>
        <div class="field">
          <label for="addr2">Address Line 2</label>
          <input type="text" id="addr2" placeholder="Suite, unit, etc. (optional)" />
        </div>
      </div>
      <div class="form-grid form-grid-3">
        <div class="field">
          <label for="city">City</label>
          <input type="text" id="city" placeholder="City" />
        </div>
        <div class="field">
          <label for="state">State</label>
          <input type="text" id="state" placeholder="CA" maxlength="2" />
        </div>
        <div class="field">
          <label for="zip">Zip Code</label>
          <input type="text" id="zip" placeholder="92106" maxlength="10" />
        </div>
      </div>
    </div>
  </div>

  <!-- Order Details -->
  <div class="section">
    <div class="section-header">Order Details</div>
    <div class="section-body">
      <div class="form-grid form-grid-2">
        <div class="field">
          <label for="ponum">Purchase Order Number</label>
          <input type="text" id="ponum" placeholder="PO-12345 (optional)" />
        </div>
        <div class="field">
          <label for="podate">Order Date</label>
          <input type="date" id="podate" />
        </div>
      </div>
    </div>
  </div>

  <!-- Shipping Contents -->
  <div class="section">
    <div class="section-header">Shipping Contents</div>
    <div class="section-body">
      <div class="product-col-headers">
        <span>Product</span>
        <span>Qty</span>
        <span>Serial Numbers (comma-separated)</span>
      </div>
      <div class="product-list" id="productList"></div>
    </div>
  </div>

  <!-- Save & Generate -->
  <div class="section">
    <div class="section-header">Save & Generate</div>
    <div class="section-body">
      <div class="options-row" style="margin-bottom:16px;">
        <label class="checkbox-label">
          <input type="checkbox" id="includeSig" />
          Include receiver signature section
        </label>
      </div>
      <hr class="divider" />
      <div class="actions-row">
        <div class="file-name-group">
          <label for="fileName" style="font-family:var(--mono);font-size:0.65rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);">File name</label>
          <input type="text" id="fileName" placeholder="Packing_List" style="flex:1;" />
          <span class="file-ext">.pdf</span>
        </div>
        <button class="btn btn-outline" onclick="clearAll()">Clear All</button>
        <button class="btn btn-primary" id="generateBtn" onclick="generate()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Generate PDF
        </button>
      </div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
const PRODUCTS = [
  { code: "001", productCode: "EVSE-B-P1-T1C-H1 A080", shortName: "PowerPort 2.2 (1PH)", fullName: "PowerPort 2.2 Single Phase" },
  { code: "002", productCode: "EVSE-B-P3-T2C-H1 A063", shortName: "PowerPort 2.2 (3PH)", fullName: "PowerPort 2.2 Three Phase" },
  { code: "003", productCode: "SM-Pedestal", shortName: "Single Mount Pedestal", fullName: "Single Mount Pedestal - for one PowerPort" },
  { code: "004", productCode: "DM-Pedestal", shortName: "Dual Mount Pedestal", fullName: "Dual Mount Pedestal - for two PowerPorts" },
  { code: "005", productCode: "CBL-NV-PP-J1772-25", shortName: "J1772 Cable (25ft)", fullName: "J1772 Charging Hose 25 ft." },
  { code: "006", productCode: "UNS-NSM2-loco", shortName: "Loco M2 Wifi (Single 2.4GHz)", fullName: "2.4GHz Single Port WIFI Antenna + POE Adapter" },
  { code: "007", productCode: "UNS-NSM5-loco", shortName: "Loco M5 Wifi (Single 5.0GHz)", fullName: "5.0GHz Single Port WIFI Antenna + POE Adapter" },
  { code: "008", productCode: "UNS-NSM2", shortName: "NSM2 Wifi (Dual 2.4GHz)", fullName: "2.4GHz Dual Port WIFI Antenna + POE Adapter" },
  { code: "009", productCode: "UNS-NSM5", shortName: "NSM5 Wifi (Dual 5.0GHz)", fullName: "5.0GHz Dual Port WIFI Antenna + POE Adapter" },
  { code: "010", productCode: "PHAROS-CPE-210", shortName: "TP-Link 210 (Single)", fullName: "2.4GHz Single Port WIFI Antenna" },
  { code: "011", productCode: "WIFI-MOUNT", shortName: "Wifi Mount", fullName: "Wall/Pedestal Mounting Kit for WIFI Antenna" },
  { code: "012", productCode: "4G-LTE-COMMS-BOX", shortName: "4G LTE Modem", fullName: "4G LTE Modem with SIM Card" },
];

// Build product rows
const list = document.getElementById('productList');
PRODUCTS.forEach(p => {
  const row = document.createElement('div');
  row.className = 'product-row';
  row.id = `row-${p.code}`;
  row.innerHTML = `
    <label class="product-check">
      <input type="checkbox" id="chk-${p.code}" onchange="toggleRow('${p.code}')" />
      <span>
        <span class="product-check-label">${p.shortName}</span>
        <span class="product-code">${p.productCode}</span>
      </span>
    </label>
    <input type="text" id="qty-${p.code}" class="qty-input" placeholder="0" disabled
           oninput="this.value=this.value.replace(/[^0-9]/g,'')" />
    <input type="text" id="ser-${p.code}" class="serial-input" placeholder="SN001, SN002…" disabled />
  `;
  list.appendChild(row);
});

function toggleRow(code) {
  const checked = document.getElementById(`chk-${code}`).checked;
  const row = document.getElementById(`row-${code}`);
  const qty = document.getElementById(`qty-${code}`);
  const ser = document.getElementById(`ser-${code}`);
  qty.disabled = !checked;
  ser.disabled = !checked;
  row.classList.toggle('active', checked);
  if (!checked) { qty.value = ''; ser.value = ''; }
  if (checked) qty.focus();
}

function clearAll() {
  PRODUCTS.forEach(p => {
    document.getElementById(`chk-${p.code}`).checked = false;
    toggleRow(p.code);
  });
  ['coname','shipdate','street','addr2','city','state','zip','ponum','podate','fileName'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('includeSig').checked = false;
}

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isError ? ' error' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = '', 3000);
}

function fmtDate(val) {
  if (!val) return '';
  const [y, m, d] = val.split('-');
  return `${m}/${d}/${y}`;
}

function generate() {
  // Collect selected products
  const items = [];
  for (const p of PRODUCTS) {
    if (!document.getElementById(`chk-${p.code}`).checked) continue;
    const qtyVal = document.getElementById(`qty-${p.code}`).value.trim();
    const qty = parseInt(qtyVal, 10);
    if (!qtyVal || isNaN(qty) || qty <= 0) {
      showToast(`Enter a valid quantity for ${p.shortName}.`, true);
      document.getElementById(`qty-${p.code}`).focus();
      return;
    }
    const serRaw = document.getElementById(`ser-${p.code}`).value;
    const serials = serRaw.split(',').map(s => s.trim()).filter(Boolean);
    items.push({ ...p, quantity: qty, serials });
  }

  if (items.length === 0) {
    showToast('Select at least one product.', true);
    return;
  }

  const coname   = document.getElementById('coname').value.trim();
  const shipdate = document.getElementById('shipdate').value;
  const street   = document.getElementById('street').value.trim();
  const addr2    = document.getElementById('addr2').value.trim();
  const city     = document.getElementById('city').value.trim();
  const state    = document.getElementById('state').value.trim();
  const zip      = document.getElementById('zip').value.trim();
  const ponum    = document.getElementById('ponum').value.trim();
  const podate   = document.getElementById('podate').value;
  const includeSig = document.getElementById('includeSig').checked;
  let fileName   = document.getElementById('fileName').value.trim() || 'Packing_List';
  if (!fileName.toLowerCase().endsWith('.pdf')) fileName += '.pdf';

  buildPDF({ coname, shipdate, street, addr2, city, state, zip, ponum, podate, includeSig, items, fileName });
}

function buildPDF({ coname, shipdate, street, addr2, city, state, zip, ponum, podate, includeSig, items, fileName }) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'letter' });

  const PW = 612, PH = 792;
  const M = 25; // margin

  // Custom colors (from original)
  const cGreen = [219, 221, 204];
  const cGray  = [48, 48, 48];

  // Double border
  doc.setLineWidth(0.5);
  doc.setDrawColor(...cGreen);
  doc.rect(M, M, PW - 2*M, PH - 2*M);
  doc.setLineWidth(1.5);
  doc.rect(M-2, M-2, PW - 2*(M-2), PH - 2*(M-2));

  // --- Header area ---
  // Company name (Nuvve)
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(7);
  doc.setTextColor(...cGray);
  doc.text('Nuvve Corp', 50, 690);

  doc.setFont('courier', 'normal');
  doc.setFontSize(7);
  doc.text('2488 Historic Decatur Rd.', 50, 675);
  doc.text('Suite 230, San Diego CA 92106, USA', 50, 660);
  doc.text('619-483-3448', 50, 645);

  // SHIP TO label
  doc.setFont('times', 'normal');
  doc.setFontSize(7);
  doc.setTextColor(80, 80, 80);
  doc.text('SHIP TO:', 300, 690);

  // Recipient
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(12);
  doc.setTextColor(...cGray);
  doc.text(coname || '—', 340, 690);

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.text(street || '—', 340, 675);
  let addrY = 645;
  if (addr2) {
    doc.text(addr2, 340, 660);
  } else {
    addrY = 660;
  }
  const cityLine = [city, state].filter(Boolean).join(', ') + (zip ? ' ' + zip : '');
  doc.text(cityLine || '—', 340, addrY);

  // Shipping date (top right)
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(7);
  doc.setTextColor(80, 80, 80);
  doc.text(`Shipping Date: ${fmtDate(shipdate) || '—'}`, 450, 735);

  // Horizontal rule under header
  doc.setLineWidth(0.5);
  doc.setDrawColor(...cGreen);
  doc.line(50, 630, PW - 50, 630);

  // PACKING LIST title
  doc.setFont('times', 'bold');
  doc.setFontSize(16);
  doc.setTextColor(...cGreen);
  doc.text('PACKING LIST', PW / 2, 618, { align: 'center' });

  // --- Order Details table ---
  let cursorY = 610;

  if (ponum || podate) {
    doc.autoTable({
      startY: cursorY - 50,
      head: [['Purchase Order Number', 'Order Date']],
      body: [[ponum || '—', fmtDate(podate) || '—']],
      margin: { left: 50, right: 50 },
      columnStyles: { 0: { cellWidth: 250 }, 1: { cellWidth: 250 } },
      headStyles: {
        fillColor: cGreen, textColor: cGray,
        fontStyle: 'bold', fontSize: 9, halign: 'center'
      },
      bodyStyles: { fontSize: 8, halign: 'center', textColor: cGray },
      tableLineColor: cGray, tableLineWidth: 0.3,
      theme: 'grid',
    });
    cursorY = doc.lastAutoTable.finalY + 12;
  } else {
    cursorY = cursorY - 30;
  }

  // --- Products table ---
  const tableBody = [];
  for (const item of items) {
    tableBody.push([item.productCode, item.fullName, String(item.quantity)]);
    if (item.serials.length > 0) {
      tableBody.push([{ content: 'Serial Numbers', styles: { halign: 'right', fontSize: 7, textColor: [120,120,120] } },
                      { content: item.serials.join(', '), styles: { fontSize: 7, textColor: [120,120,120] } },
                      '']);
    }
  }

  doc.autoTable({
    startY: cursorY,
    head: [['Product Code', 'Description', 'Qty']],
    body: tableBody,
    margin: { left: 50, right: 50 },
    columnStyles: {
      0: { cellWidth: 150, halign: 'center' },
      1: { cellWidth: 300 },
      2: { cellWidth: 50, halign: 'center' },
    },
    headStyles: {
      fillColor: cGreen, textColor: cGray,
      fontStyle: 'bold', fontSize: 9, halign: 'center'
    },
    bodyStyles: { fontSize: 8, textColor: cGray, valign: 'middle' },
    tableLineColor: cGray, tableLineWidth: 0.3,
    theme: 'grid',
  });

  // --- Signature section ---
  if (includeSig) {
    doc.autoTable({
      startY: PH - 100,
      head: [['Received By', 'Signature', 'Received Date']],
      body: [['\n\n', '\n\n', '\n\n']],
      margin: { left: 50, right: 50 },
      columnStyles: {
        0: { cellWidth: 200 },
        1: { cellWidth: 200 },
        2: { cellWidth: 100 },
      },
      headStyles: {
        fillColor: cGreen, textColor: cGray,
        fontStyle: 'bold', fontSize: 9, halign: 'center'
      },
      bodyStyles: { fontSize: 8, textColor: cGray, halign: 'center' },
      tableLineColor: cGray, tableLineWidth: 0.3,
      theme: 'grid',
    });
  }

  doc.save(fileName);
  showToast(`✓ ${fileName} downloaded`);
}
</script>
</body>
</html>
